<style>
    .svg_map text {
        font-family: Peyda,Quicksand-Bold, Quicksand,Tohama !important;

    }
    .svg_map svg {
        direction: ltr;
    }
    .svg_map svg g.active circle:first-child {
        fill: #00ff62 !important;
        opacity: 0.13 !important;
    }
    .svg_map svg g.active circle:nth-child(2) {
        fill: #00ff62 !important;
    }
    .svg_map svg g.active.handly circle:first-child::after {
        content: 'دستی';
    }
    .status_bar {
        position: absolute;
        top: 10px;
        left: 10px;
    }
    .status_bar > div {
        margin-bottom: 8px;
        font-size: 15px;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        background-color: #ff27277a;
        border: 1px solid #ff2727;
        animation: pulse 2s infinite;
    }
    .status_bar > div.online {
        background-color: #2eff277a;
        border-color: #2eff27;
    }
</style>
